services:
  - type: web
    name: visualcrypto
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_CONTENT_LENGTH_MB
        value: 16
      - key: FILE_CLEANUP_MAX_AGE_SECONDS
        value: 3600
      - key: SECRET_KEY
        generateValue: true
